<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145A32"/>
      <stop offset="50%" stop-color="#0E3D22"/>
      <stop offset="100%" stop-color="#082515"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="softGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF3CF"/>
      <stop offset="100%" stop-color="#D4AC0D"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer circular frame with gold trim -->
  <circle cx="256" cy="256" r="246" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#subtleShadow)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Islamic 8-point geometric star rosette in background -->
  <g opacity="0.12" fill="url(#goldGrad)">
    <rect x="136" y="136" width="240" height="240" rx="16"/>
    <rect x="136" y="136" width="240" height="240" rx="16" transform="rotate(45 256 256)"/>
  </g>

  <!-- Central Mosque Dome & Minaret Silhouette -->
  <g fill="url(#goldGrad)">
    <!-- Central Dome -->
    <path d="M256 128 C236 172 208 200 208 240 L304 240 C304 200 276 172 256 128 Z"/>
    <!-- Dome Finial/Spire -->
    <path d="M254 100 L258 100 L258 128 L254 128 Z"/>
    <circle cx="256" cy="98" r="4"/>
    <circle cx="256" cy="88" r="3"/>
    <!-- Crescent on Spire -->
    <path d="M256 70 A10 10 0 1 0 264 88 A13 13 0 1 1 256 70 Z"/>

    <!-- Left Minaret -->
    <rect x="180" y="170" width="16" height="70" rx="2"/>
    <path d="M176 170 L200 170 L188 144 Z"/>
    <rect x="178" y="140" width="20" height="4" rx="1"/>

    <!-- Right Minaret -->
    <rect x="316" y="170" width="16" height="70" rx="2"/>
    <path d="M312 170 L336 170 L324 144 Z"/>
    <rect x="314" y="140" width="20" height="4" rx="1"/>

    <!-- Base Arch and pillars -->
    <path d="M168 240 L344 240 L344 266 L168 266 Z"/>
    <path d="M200 266 L200 300 C200 286 216 274 232 274 L280 274 C296 274 312 286 312 300 L312 266 Z" opacity="0.9"/>
  </g>

  <!-- Typography / Calligraphy Ring -->
  <text x="256" y="344" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="url(#softGold)" text-anchor="middle" letter-spacing="3">
    JAMAT RAZA-E-MUSTAFA
  </text>
  <text x="256" y="378" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    ANTOPHILL • MUMBAI
  </text>
  <text x="256" y="410" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
    MAHANA SUNNI DEENI NASHISHT
  </text>

  <!-- Bottom trust badge -->
  <rect x="186" y="432" width="140" height="26" rx="13" fill="#061F12" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <text x="256" y="449" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F9E79F" text-anchor="middle" letter-spacing="1.5">
    EST. ANTOPHILL
  </text>
</svg>
